version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: 2minreview-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: 2minreview
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: 2minreview-ml-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      ML_SERVICE_PORT: 5001
      BACKEND_API_URL: http://backend:5000/api
    volumes:
      - ml-uploads:/app/uploads
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 2minreview-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/2minreview?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      FRONTEND_URL: http://localhost:3000
      ML_SERVICE_URL: http://ml-service:5001/api/ml
    depends_on:
      - postgres
      - ml-service
    networks:
      - app-network
    command: sh -c "npm run prisma:migrate && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 2minreview-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:
  ml-uploads:

networks:
  app-network:
    driver: bridge
